<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Dés – Simulateur de jets</title>
<link rel="stylesheet" href="./src/dice/dice.css" />
</head>
<body>
  <header class="titlebar">
    <h1>Jet de dés</h1>
  </header>

  <main class="stage">
    <div id="total" class="total" role="status" aria-label="Total"></div>
    <section class="history" aria-label="Historique des jets">
      <div class="board-head">
        <span>Heure</span><span>Dés</span><span>Résultat</span>
        <button id="clear" type="button" class="link">Effacer</button>
      </div>
      <ol id="history"></ol>
      <p id="empty" class="empty">Aucun jet pour l'instant.</p>
    </section>
  </main>

  <footer class="strip">
    <div class="plate">
      <i class="hole h1"></i><i class="hole h2"></i><i class="hole h3"></i><i class="hole h4"></i>
      <svg id="dial-count" class="dial d-count" viewBox="0 0 200 160"></svg>
      <i class="sep s-a"></i>
      <svg id="dial-kind" class="dial d-kind" viewBox="0 0 200 160"></svg>
      <i class="sep s-b"></i>
      <div class="pbs">
        <button class="pb" id="pb-sound" type="button" aria-label="Sound" aria-pressed="false">
          <span class="lens face">Sound</span><span class="lens led red" id="led-mute">Mute</span></button>
        <button class="pb" id="pb-launch" type="button" aria-label="Launch">
          <span class="lens face">Launch</span><span class="lens led green" id="led-run">Running</span></button>
        <button class="pb" id="pb-exit" type="button" aria-label="Exit">
          <span class="lens face">Exit</span><span class="lens led red lit">Program</span></button>
      </div>
    </div>
  </footer>
<script type="module" src="./src/dice/dice.js"></script>
</body>
</html>
