<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<title>Dés 2 – Simulateur de jets</title>
<link rel="stylesheet" href="./src/dice2/dice2.css" />
</head>
<body>
  <div class="stack">
    <section class="panel p-blocks">
      <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
      <h1 class="engrave">Jet de dés</h1>
      <div class="grid3" id="flips"></div>
    </section>

    <section class="panel p-screen" aria-label="Historique des jets">
      <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
      <div class="window"><div class="lcd" id="lcd" role="log" aria-live="polite" aria-label="Historique des jets"></div></div>
      <div class="clr"><span>Clear</span><button id="btn-clear" type="button" aria-label="Clear : effacer l'historique"></button></div>
    </section>

    <footer class="panel bot">
      <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
      <div class="dials">
        <svg id="dial-count" class="dial" viewBox="0 0 200 160"></svg>
        <svg id="dial-kind" class="dial" viewBox="0 0 200 160"></svg>
      </div>
      <div class="ctrls">
        <div class="pbs">
          <button class="pb" id="pb-sound" type="button" aria-label="Sound" aria-pressed="false"><span class="lens face">Sound</span><span class="lens led red" id="led-mute">Mute</span></button>
          <button class="pb" id="pb-launch" type="button" aria-label="Launch"><span class="lens face">Launch</span><span class="lens led green" id="led-run">Running</span></button>
        </div>
      </div>
    </footer>
  </div>
<script type="module" src="./src/dice2/dice2.js"></script>
</body>
</html>
